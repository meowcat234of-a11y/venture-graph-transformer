[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "venture-graph-transformer"
version = "0.1.0"
description = "Dual-layer system combining from-scratch decoder-only transformer with async graph pipeline."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "networkx>=3.0",
    "httpx>=0.24.0",
    "pandas>=2.0.0",
    "streamlit>=1.20.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["analytics*", "dashboard*", "model*", "pipeline*"]
namespaces = true

[project.urls]
Repository = "https://github.com/meowcat234of-a11y/venture-graph-transformer"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
