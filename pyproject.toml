[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "venture-graph-transformer"
version = "0.1.0"
description = "Dual-layer system combining from-scratch decoder-only transformer with async graph pipeline."
authors = [
    { name="Master Engineer" }
]
dependencies = [
    "torch>=2.0.0",
    "networkx>=3.0",
    "httpx>=0.24.0",
    "streamlit>=1.20.0"
]
